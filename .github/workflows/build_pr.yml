name: Build PR

on:
    pull_request:
        branches:
            - master
            - v5-lts

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: ./.github/actions/dependencies
                with:
                    cpp2ilxdx-token: ${{ secrets.CPP2ILXDX_TOKEN }}
            -   name: Build
                run: |
                    ./build.sh --target Publish
            -   name: Upload Artifacts
                uses: actions/upload-artifact@v4
                with:
                    path: "./bin/dist/*.zip"
                    name: "BepInEx_CI"
